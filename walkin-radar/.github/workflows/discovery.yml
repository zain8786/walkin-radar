name: discovery

on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch:

concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discovery/requirements.txt

      - name: Install
        run: pip install -r discovery/requirements.txt

      - name: Test
        run: cd discovery && python -m unittest discover -s tests -v

      - name: Expire, discover, verify
        working-directory: discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m walkin_discovery expire
          python -m walkin_discovery run
          python -m walkin_discovery verify
